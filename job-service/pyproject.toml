[project]
name = "api"
version = "0.1.0"
description = ""
authors = [
    {name = "houston-d",email = "dougalhouston@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "transformers>=5.0.0,<6.0.0",
    "torch (>=2.7.0,<3.0.0)",
    "torchvision (>=0.22.0,<0.27.0)",
    "torchaudio (>=2.7.0,<3.0.0)",
    "accelerate (>=1.0.0,<2.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.6.0"
black = "^26.5.1"
mypy = "^2.3.1"


[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "pytorch-cu128"}
torchvision = {source = "pytorch-cu128"}
torchaudio = {source = "pytorch-cu128"}
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
